<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>无水印素材 · 弹窗面板 V3</title>
<style>
:root{
  --panel-w:1020px;
  --panel-h:620px;
  --panel-radius:12px;
  --theme-bg-image:none;
  --theme-bg-opacity:0;
  --theme-modal-bg:#fff;
  --theme-modal-radius:12px;
  --theme-sidebar-radius:10px;
  --theme-content-radius:12px;
  --theme-card-radius:8px;
  --theme-title-family:system-ui,-apple-system,sans-serif;
  --theme-title-size:18px;
  --theme-title-weight:600;
  --theme-title-spacing:0;
  --theme-close-size:32px;
  --theme-close-radius:6px;
  --theme-close-font-size:22px;
  --theme-close-top:28px;
  --theme-close-right:28px;
  --theme-title-shadow:none;
  --theme-quote-shadow:none;
  --theme-text:#262323;
  --theme-muted:#6f6967;
  --theme-modal-border:transparent;
  --theme-close-border:rgba(0,0,0,.18);
  --theme-close-bg:rgba(255,255,255,.84);
  --theme-close-shadow:none;
  --theme-close-hover-border:rgba(0,0,0,.26);
  --theme-close-hover-bg:#f3f3f3;
  --theme-sidebar-border:transparent;
  --theme-sidebar-bg:#fff;
  --theme-sidebar-decoration:none;
  --theme-sidebar-shadow:none;
  --theme-panel-border:transparent;
  --theme-panel-bg:#fff;
  --theme-panel-shadow:none;
  --theme-nav-border:rgba(0,0,0,.16);
  --theme-nav-bg:#fff;
  --theme-nav-active-border:rgba(0,0,0,.16);
  --theme-nav-active-bg:rgba(0,0,0,.055);
  --theme-nav-hover-border:rgba(0,0,0,.2);
  --theme-nav-hover-bg:rgba(0,0,0,.04);
  --theme-card-border:rgba(0,0,0,.08);
  --theme-card-bg:#fff;
  --theme-card-shadow:none;
  --theme-action-primary-border:rgba(0,0,0,.24);
  --theme-action-primary-bg:#fff;
  --theme-action-border:rgba(0,0,0,.16);
  --theme-action-bg:#fff;
  --theme-action-hover-bg:#f3f3f3;
  --theme-action-primary-hover-bg:#f3f3f3;
  --theme-action-text:#292626;
  --theme-accent:#343030;
  --theme-quote:#3f3937;
  --theme-quote-accent:#5f5754;
  --theme-footer-bg:#fff;
  --theme-footer-color:#6f6967;
  --theme-footer-hover-color:#262323;
  --theme-preview-border:transparent;
  --theme-preview-shadow:none;
  --theme-preview-close-hover-bg:#f3f3f3;
  --theme-preview-close-border:rgba(255,255,255,.62);
  --theme-preview-close-bg:rgba(108,108,108,.42);
  --theme-preview-close-color:#fff;
  --theme-preview-close-radius:6px;
  --theme-preview-close-hover-color:#262323;
  --theme-shadow:none;
  --theme-scrollbar-track:rgba(0,0,0,.08);
  --theme-scrollbar-thumb:rgba(0,0,0,.28);
  --theme-scrollbar-thumb-hover:rgba(0,0,0,.42);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  overflow:hidden;
  background:transparent;
  color:var(--theme-text);
  font-family:"Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif;
}
button,input,select{font:inherit}
button{color:inherit}

.modal-stage{
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
  padding:0;
  background:transparent;
}
.modal{
  position:relative;
  flex:0 0 auto;
  width:var(--panel-w);
  height:var(--panel-h);
  transform:scale(var(--panel-scale, 1));
  transform-origin:center;
  border-radius:var(--theme-modal-radius);
  overflow:hidden;
  border:1px solid var(--theme-modal-border);
  background:var(--theme-modal-bg);
  box-shadow:var(--theme-shadow);
}
.bg{
  position:absolute; inset:0;
  background:var(--theme-bg-image) center/cover no-repeat;
  opacity:var(--theme-bg-opacity);
}

.close{
  position:absolute; top:var(--theme-close-top); right:var(--theme-close-right); z-index:10;
  width:var(--theme-close-size); height:var(--theme-close-size); border-radius:var(--theme-close-radius);
  border:1px solid var(--theme-close-border);
  background:var(--theme-close-bg);
  box-shadow:var(--theme-close-shadow);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  font-size:var(--theme-close-font-size);
  line-height:1;
  font-family:Arial,sans-serif;
  font-weight:300;
  color:var(--theme-text);
  cursor:pointer;
}
.close:hover{
  border-color:var(--theme-close-hover-border);
  background:var(--theme-close-hover-bg);
}

.header{
  position:absolute; z-index:5;
  left:28px; right:76px; top:16px;
  height:76px;
}
.title{
  font-family:var(--theme-title-family);
  font-size:var(--theme-title-size);
  font-weight:var(--theme-title-weight);
  letter-spacing:var(--theme-title-spacing);
  text-shadow:var(--theme-title-shadow);
  color:var(--theme-text);
}
.meta{
  margin-top:7px;
  font-size:14px;
  color:var(--theme-text);
}
.meta:before,.meta:after{
  content:"◆";
  font-size:8px;
  vertical-align:middle;
  margin:0 8px;
  color:var(--theme-text);
}
.quote{
  position:absolute;
  z-index:2;
  left:180px; right:114px; top:3px;
  text-align:center;
  font-family:serif;
  font-size:15px;
  color:var(--theme-quote);
  white-space:nowrap;
  text-shadow:var(--theme-quote-shadow);
}
.quote .q{
  color:var(--theme-accent);
  font-size:30px;
  vertical-align:-7px;
  font-weight:700;
}
.quote em{
  display:block;
  margin-top:2px;
  color:var(--theme-quote-accent);
  font-size:16px;
  font-style:italic;
}
.quote.is-empty{display:none}

.layout{
  position:absolute;
  z-index:5;
  left:18px; right:18px; top:92px; bottom:18px;
  min-height:0;
  display:grid;
  grid-template-columns:194px minmax(0,1fr);
  gap:16px;
}

.sidebar{
  position:relative;
  min-height:0;
  border-radius:var(--theme-sidebar-radius);
  overflow:hidden;
  border:1px solid var(--theme-sidebar-border);
  background:var(--theme-sidebar-bg);
  box-shadow:var(--theme-sidebar-shadow);
}
.sidebar::before{
  content:"";
  position:absolute; inset:0;
  background:var(--theme-sidebar-decoration);
}
.nav{
  position:absolute;
  left:16px; right:16px; bottom:104px;
  display:flex; flex-direction:column; gap:13px;
}
.nav button{
  height:50px;
  border-radius:8px;
  border:1px solid var(--theme-nav-border);
  background:var(--theme-nav-bg);
  display:flex; align-items:center; gap:12px;
  padding:0 18px;
  font-size:15px;
  color:var(--theme-text);
  box-shadow:none;
  cursor:pointer;
  transition:background-color .15s ease, border-color .15s ease, color .15s ease;
}
.nav button.active{
  border-color:var(--theme-nav-active-border);
  background:var(--theme-nav-active-bg);
  color:var(--theme-text);
  box-shadow:none;
}
.nav button:hover:not(.active){
  border-color:var(--theme-nav-hover-border);
  background:var(--theme-nav-hover-bg);
}
.nav .icon{
  width:18px;
  height:18px;
  flex:0 0 18px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  color:var(--theme-text);
}
.nav .icon svg{
  display:block;
  width:18px;
  height:18px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.panel-footer{
  position:absolute;
  left:18px;
  bottom:18px;
  width:194px;
  z-index:8;
  height:34px;
  padding:0 10px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  color:var(--theme-footer-color);
  font-size:11px;
  white-space:nowrap;
  background:var(--theme-footer-bg);
  border-top:1px solid rgba(123,30,44,.42);
  border-radius:0 0 18px 18px;
}
.panel-footer a{
  display:inline-flex;
  align-items:center;
  gap:5px;
  color:inherit;
  text-decoration:none;
  transition:color .15s ease;
}
.panel-footer a:hover{color:var(--theme-footer-hover-color)}
.panel-footer svg{width:13px; height:13px; fill:currentColor; opacity:.85}
.panel-footer .divider{width:1px; height:12px; background:rgba(232,217,212,.35)}
.content{
  min-width:0;
  min-height:0;
  border-radius:var(--theme-content-radius);
  border:1px solid var(--theme-panel-border);
  background:var(--theme-panel-bg);
  box-shadow:var(--theme-panel-shadow);
  padding:14px 14px 12px;
  display:flex; flex-direction:column;
}
.grid{
  flex:1;
  min-height:0;
  width:calc(100% + 10px);
  margin-right:-10px;
  overflow:auto;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  grid-auto-rows:150px;
  align-content:start;
  gap:12px;
  scrollbar-width:thin;
  scrollbar-color:transparent transparent;
  scrollbar-gutter:stable;
}
.grid::-webkit-scrollbar{
  width:10px;
  height:10px;
  background:transparent;
}
.grid::-webkit-scrollbar-track{
  margin:4px 0;
  border-radius:10px;
  background:transparent;
}
.grid::-webkit-scrollbar-thumb{
  border:2px solid transparent;
  border-radius:10px;
  background:transparent;
  background-clip:padding-box;
}
.grid:hover,
.grid.is-scrolling{
  scrollbar-color:var(--theme-scrollbar-thumb) var(--theme-scrollbar-track);
}
.grid:hover::-webkit-scrollbar-track,
.grid.is-scrolling::-webkit-scrollbar-track{
  background:var(--theme-scrollbar-track);
}
.grid:hover::-webkit-scrollbar-thumb,
.grid.is-scrolling::-webkit-scrollbar-thumb{
  border-color:var(--theme-scrollbar-track);
  background:var(--theme-scrollbar-thumb);
}
.grid::-webkit-scrollbar-thumb:hover{
  border-color:var(--theme-scrollbar-track);
  background:var(--theme-scrollbar-thumb-hover);
}
.grid::-webkit-scrollbar-button{
  display:none;
  width:0;
  height:0;
}
.card{
  min-width:0; min-height:0;
  border-radius:var(--theme-card-radius);
  overflow:hidden;
  border:1px solid var(--theme-card-border);
  background:var(--theme-card-bg);
  box-shadow:var(--theme-card-shadow);
  display:flex; flex-direction:column;
}
.thumb{
  position:relative;
  height:auto;
  min-height:96px;
  flex:1 1 auto;
  overflow:hidden;
  background:#050505;
}
.thumb img,.thumb video{
  display:block;
  width:100%; height:100%;
  object-fit:cover;
  background:#050505;
}
.thumb .dur{
  position:absolute;
  top:5px; right:5px;
  font-size:11px;
  line-height:1;
  padding:2px 6px;
  border-radius:10px;
  background:rgba(0,0,0,.5);
  color:#f6ece8;
}
.thumb .dimensions{
  font-size:10px;
  padding:2px 5px;
}
.play-toggle{
  position:absolute;
  left:50%; top:50%;
  width:34px; height:34px;
  transform:translate(-50%,-50%);
  padding:0;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.28);
  cursor:pointer;
  transition:background-color .15s ease, transform .15s ease;
}
.play-toggle::before{
  content:"";
  position:absolute;
  left:13px; top:9px;
  width:0; height:0;
  border-top:8px solid transparent;
  border-bottom:8px solid transparent;
  border-left:11px solid rgba(255,255,255,.94);
}
.play-toggle.is-playing::before{
  left:12px; top:9px;
  width:4px; height:16px;
  border:0;
  background:#fff;
  box-shadow:7px 0 0 #fff;
}
.play-toggle:hover{
  background:rgba(0,0,0,.48);
  transform:translate(-50%,-50%) scale(1.05);
}
.preview-modal{
  position:fixed;
  inset:0;
  z-index:20;
  display:none;
  align-items:center;
  justify-content:center;
  padding:28px;
  background:rgba(0,0,0,.76);
}
.preview-modal.show{display:flex}
.preview-dialog{
  position:relative;
  width:min(860px,100%);
  max-height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--theme-preview-border);
  border-radius:12px;
  overflow:hidden;
  background:#050505;
  box-shadow:var(--theme-preview-shadow);
}
.preview-dialog img,.preview-dialog video{
  display:block;
  width:100%;
  max-height:calc(var(--panel-h) - 70px);
  object-fit:contain;
  background:#050505;
}
.preview-close{
  position:absolute;
  top:10px; right:10px;
  z-index:2;
  width:32px; height:32px;
  border:1px solid var(--theme-preview-close-border);
  border-radius:var(--theme-preview-close-radius);
  background:var(--theme-preview-close-bg);
  color:var(--theme-preview-close-color);
  font-size:22px;
  line-height:1;
  cursor:pointer;
}
.preview-close:hover{
  background:var(--theme-preview-close-hover-bg);
  color:var(--theme-preview-close-hover-color);
}
.empty-state{
  grid-column:1/-1;
  display:grid;
  place-items:center;
  color:#bdaea8;
}
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  padding:4px 8px 5px;
  margin-top:auto;
  flex:0 0 auto;
}
.actions button{
  height:24px;
  border-radius:6px;
  border:1px solid var(--theme-action-border);
  background:var(--theme-action-bg);
  color:var(--theme-action-text);
  font-size:12px;
  cursor:pointer;
}
.actions button:first-child{
  border-color:var(--theme-action-primary-border);
  background:var(--theme-action-primary-bg);
}
.actions button:hover{background:var(--theme-action-hover-bg)}
.actions button:first-child:hover{background:var(--theme-action-primary-hover-bg)}

.toast{
  position:absolute; left:50%; bottom:16px; z-index:12;
  transform:translateX(-50%) translateY(8px);
  background:rgba(24,14,15,.98);
  border:1px solid rgba(117,35,47,.95);
  color:#f6ece9;
  padding:8px 14px;
  border-radius:8px;
  opacity:0; transition:.18s ease;
  pointer-events:none;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

</style>
</head>
<body>
<div class="modal-stage">
  <div class="modal" id="modal">
    <div class="bg"></div>
    <button class="close" type="button" title="关闭" aria-label="关闭">×</button>

    <header class="header">
      <div class="title">无水印素材</div>
      <div class="meta">共 0 个视频素材</div>
      <div class="quote">
        <span class="q">“</span><span class="quote-text"></span><span class="q">”</span>
        <em class="quote-author"></em>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="nav">
          <button class="active" data-type="video"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="m16 10 5-3v10l-5-3z"></path></svg></span>视频素材</button>
          <button data-type="image"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="8.5" cy="9" r="1.5"></circle><path d="m21 16-5-5-6 6-2-2-5 5"></path></svg></span>图片素材</button>
        </div>
      </aside>

      <section class="content">
        <div class="grid" id="grid"></div>
      </section>
    </div>

    <div class="panel-footer">
      <a href="https://github.com/ihmily/doubao-nomark" target="_blank" rel="noopener noreferrer" title="开源项目">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.21 11.39.6.11.79-.26.79-.58v-2.23c-3.34.73-4.03-1.42-4.03-1.42-.55-1.39-1.33-1.76-1.33-1.76-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.49 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23.96-.27 1.98-.4 3-.4s2.05.14 3.01.4c2.29-1.55 3.3-1.23 3.3-1.23.65 1.65.24 2.87.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.62-5.48 5.92.43.37.82 1.1.82 2.22v3.29c0 .32.19.69.8.58A12.01 12.01 0 0 0 24 12C24 5.37 18.63 0 12 0Z"/></svg>
        <span>开源项目</span>
      </a>
      <span class="divider" aria-hidden="true"></span>
      <span>© 2026 无印豆包</span>
    </div>

    <div class="toast" id="toast">已复制地址</div>
  </div>
  <div class="preview-modal" id="preview-modal" role="dialog" aria-modal="true" aria-label="素材预览">
    <div class="preview-dialog" id="preview-dialog">
      <button class="preview-close" id="preview-close" type="button" title="关闭预览" aria-label="关闭预览">×</button>
    </div>
  </div>
</div>

<script src="themes.js"></script>
<script src="panel.js"></script>
</body>
</html>
